name: Build APK

# Builds a signed Audenic.apk from a source APK and proves the packaged Studio
# matches this repo. Manual trigger: paste a direct download URL for the source
# APK (your current Audenic.apk, or Lark_Player.zip).

on:
  workflow_dispatch:
    inputs:
      source_apk_url:
        description: "Direct download URL for the source APK (Audenic.apk or Lark_Player.zip)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Tests
        run: |
          set -euo pipefail
          node assets/transfer_web/core.test.mjs
          python3 tests/build_verify_test.py

      - name: Fetch build tools
        run: python build_audenic.py --fetch-tools

      - name: Download source APK
        env:
          SOURCE_URL: ${{ inputs.source_apk_url }}
        run: |
          set -euo pipefail
          curl -fL --retry 3 --retry-delay 2 -o Lark_Player.zip "$SOURCE_URL"
          ls -lh Lark_Player.zip
          python -c "import zipfile,sys; z=zipfile.ZipFile('Lark_Player.zip'); names=set(z.namelist()); need={'AndroidManifest.xml','resources.arsc'}; missing=need-names; print('entries:', len(names)); sys.exit('not an APK - missing: '+', '.join(sorted(missing)) if missing else 0)"

      - name: Doctor
        run: python build_audenic.py --doctor

      - name: Build and sign
        env:
          AUDENIC_ROOT: ${{ github.workspace }}
          AUDENIC_SOURCE_APK: ${{ github.workspace }}/Lark_Player.zip
        run: python build_audenic.py

      - name: Verify the Studio inside the APK
        env:
          AUDENIC_ROOT: ${{ github.workspace }}
        run: |
          set -euo pipefail
          apk="$(find dist -maxdepth 1 -name '*.apk' | head -n 1)"
          test -n "$apk"
          python build_audenic.py --verify "$apk"
          sha256sum "$apk" > dist/SHA256SUMS.txt
          cat dist/SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: audenic-apk
          path: |
            dist/*.apk
            dist/SHA256SUMS.txt
          if-no-files-found: error

name: Build APK

# Builds a debug-signed Audenic APK from a source APK and proves the packaged
# Studio, branding, and Android signature are valid.
#
# Source APK resolution order:
#   1. Manual `source_apk_url` input (workflow_dispatch)
#   2. Repository secret or variable `AUDENIC_SOURCE_APK_URL`
#   3. Asset `Lark_Player.zip` on a `source-base` release in this repo

on:
  workflow_dispatch:
    inputs:
      source_apk_url:
        description: "Direct download URL for the source APK (optional if AUDENIC_SOURCE_APK_URL or source-base release is set)"
        required: false
        type: string
        default: ""
  push:
    branches:
      - main
      - "arena/**"

permissions:
  contents: read

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run unit and build-guard tests
        run: |
          set -euo pipefail
          node assets/transfer_web/core.test.mjs
          python3 tests/build_verify_test.py
          python3 -m py_compile gemini_companion.py build_audenic.py

      - name: Fetch build tools
        run: python3 build_audenic.py --fetch-tools

      - name: Resolve source APK
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_URL: ${{ inputs.source_apk_url }}
          SECRET_URL: ${{ secrets.AUDENIC_SOURCE_APK_URL }}
          VAR_URL: ${{ vars.AUDENIC_SOURCE_APK_URL }}
        run: |
          set -euo pipefail
          URL="${INPUT_URL:-${SECRET_URL:-${VAR_URL:-}}}"
          if [ -n "$URL" ]; then
            echo "Downloading source APK from configured URL..."
            curl -fL --retry 3 --retry-delay 2 -o Lark_Player.zip "$URL"
            echo "available=true" >> "$GITHUB_OUTPUT"
          elif gh release download source-base -p "Lark_Player.zip" -O Lark_Player.zip 2>/dev/null; then
            echo "Downloaded Lark_Player.zip from source-base release."
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "No source APK URL or source-base release asset configured — skipping APK packaging."
            echo "available=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          ls -lh Lark_Player.zip
          python3 -c "import zipfile,sys; z=zipfile.ZipFile('Lark_Player.zip'); names=set(z.namelist()); need={'AndroidManifest.xml','resources.arsc'}; missing=need-names; print('entries:', len(names)); sys.exit('not an APK - missing: '+', '.join(sorted(missing)) if missing else 0)"

      - name: Doctor
        if: steps.source.outputs.available == 'true'
        run: python3 build_audenic.py --doctor

      - name: Build and debug-sign APK
        if: steps.source.outputs.available == 'true'
        env:
          AUDENIC_ROOT: ${{ github.workspace }}
          AUDENIC_SOURCE_APK: ${{ github.workspace }}/Lark_Player.zip
        run: python3 build_audenic.py

      - name: Verify Studio, Android signature, and badging
        if: steps.source.outputs.available == 'true'
        env:
          AUDENIC_ROOT: ${{ github.workspace }}
        run: |
          set -euo pipefail
          apk="$(find dist -maxdepth 1 -name '*.apk' | head -n 1)"
          test -n "$apk"
          python3 build_audenic.py --verify "$apk"

          cp "$apk" dist/Audenic-debug.apk
          BUILD_TOOLS="$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/build-tools" -maxdepth 1 -mindepth 1 | sort -V | tail -n 1)"
          if [ -n "$BUILD_TOOLS" ]; then
            "$BUILD_TOOLS/apksigner" verify --verbose dist/Audenic-debug.apk
            "$BUILD_TOOLS/aapt2" dump badging dist/Audenic-debug.apk | head -n 25
          fi

          sha256sum dist/Audenic-debug.apk > dist/SHA256SUMS.txt
          cat dist/SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        if: steps.source.outputs.available == 'true'
        with:
          name: audenic-debug-apk
          path: |
            dist/Audenic-debug.apk
            dist/SHA256SUMS.txt
          if-no-files-found: error

<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: transparent;
    width: 582px;
    height: 168px;
    overflow: hidden;
    display: flex;
    align-items: center;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }
  .container {
    display: flex;
    align-items: center;
    gap: 18px;
    padding-left: 12px;
  }
  .wordmark {
    font-size: 52px;
    font-weight: 800;
    letter-spacing: 0.08em;
    color: #ffffff;
    text-transform: uppercase;
    display: flex;
    align-items: center;
    line-height: 1;
  }
  .accent {
    color: #4deec8;
  }
  .sparkle {
    display: inline-block;
    margin-left: 6px;
    color: #4deec8;
    font-size: 32px;
    filter: drop-shadow(0 0 8px rgba(77, 238, 200, 0.8));
  }
</style>
</head>
<body>
<div class="container">
  <!-- Audenic Neon Logo Vector -->
  <svg width="108" height="108" viewBox="0 0 108 108" fill="none" xmlns="http://www.w3.org/2000/svg">
    <!-- Outer Glow Ring -->
    <circle cx="54" cy="54" r="48" stroke="#2596ff" stroke-width="2.5" stroke-opacity="0.35"/>
    <circle cx="54" cy="54" r="42" stroke="#4deec8" stroke-width="2" stroke-opacity="0.45"/>
    <!-- Equalizer Micro-Accents -->
    <rect x="2" y="47" width="5" height="14" rx="2.5" fill="#4deec8" fill-opacity="0.9"/>
    <rect x="101" y="47" width="5" height="14" rx="2.5" fill="#2596ff" fill-opacity="0.9"/>
    <!-- Stylized Geometric 'A' Vector -->
    <path d="M54 22L28 82H42L49 64H59L66 82H80L54 22Z" fill="url(#audenic_grad)"/>
    <!-- Inner Notch -->
    <polygon points="54,38 46,56 62,56" fill="#0b0e17"/>
    <!-- Core Sonic Core -->
    <circle cx="54" cy="68" r="4.5" fill="#ffffff" filter="drop-shadow(0 0 4px #4deec8)"/>
    <defs>
      <linearGradient id="audenic_grad" x1="28" y1="52" x2="80" y2="52" gradientUnits="userSpaceOnUse">
        <stop stop-color="#4deec8"/>
        <stop offset="1" stop-color="#2596ff"/>
      </linearGradient>
    </defs>
  </svg>

  <!-- High-Craft Wordmark -->
  <div class="wordmark">
    AUDENIC<span class="sparkle">&#10022;</span>
  </div>
</div>
</body>
</html>
